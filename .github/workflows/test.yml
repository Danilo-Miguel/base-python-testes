name: Teste Auth Service

on:
  push:
    branches: [aula1/pytest-unit-test]

  pull_request: 
    branches: [aula1/pytest-unit-test]


jobs:
  test-auth-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./burguer-app/auth-service

    steps:
    - name: 📦 Checkout do código
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.4'

    - name: 📚 Instalar dependências do auth-service
      working-directory: ./burguer-app/auth-service
      run: |
        pip install -r requirements.txt
       

    - name: 🧪 Rodar testes com cobertura
      run: |
        pytest -v
        pytest  --cov=controllers --cov=services --cov=models --cov=config --cov-report=term-missing
        radon cc ./tests 
        
        pylint ./tests/