name: Testes Auth Service

on:
  push:
    branches: [test/unit-test-preparation]
   
  pull_request:
    branches: [test/unit-test-preparation]

jobs:
  test-auth-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./burguer-app/auth-service

    steps:
    - name: 📦 Checkout do código
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.4'

    - name: 📚 Instalar dependências do auth-service
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: 🧪 Rodar testes com cobertura
      run: |
        pytest -v
        pytest  --cov=controllers --cov=services --cov=models --cov=config --cov-report=term-missing
        pylint .\tests\